[versions]
agp = "9.3.3"
appcompat = "1.8.0"
dagger = "2.60.1"
guavaAndroid = "33.7.2-android"
guavaJre = "33.7.2-jre"
junit = "4.13.2"
junitVersion = "1.3.0"
mockito-core = "5.24.0"
robolectric = "4.17"
rxandroid2 = "2.1.1"       # 2.1.1 is the last common version for RxJava and RxAndroid
testEspressoCore = "3.7.0"
truth = "1.4.5"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "testEspressoCore" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }
guava-android = { group = "com.google.guava", name = "guava", version.ref = "guavaAndroid" }
guava-jre = { group = "com.google.guava", name = "guava", version.ref = "guavaJre" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito-core" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
rxandroid2 = { group = "io.reactivex.rxjava2", name = "rxandroid", version.ref = "rxandroid2" }
rxjava2 = { group = "io.reactivex.rxjava2", name = "rxjava", version.ref = "rxandroid2" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
